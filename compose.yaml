name: ferma
services:
  app:
    build: .
    image: ferma:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    env_file:
      - path: ./docker.env
        required: false
    volumes:
      - data:/data
      # Photo folders named like profiles; read-only.
      - type: bind
        source: ${FERMA_PHOTOS:-C:/Users/almaz/Desktop/FERMA PHOTO}
        target: /photos
        read_only: true
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 30s
    # Rendering trial reels is CPU work: the container never takes more than 4 of the 12 threads,
    # so OBS and games on this PC keep the rest.
    cpus: 4
volumes:
  data:
